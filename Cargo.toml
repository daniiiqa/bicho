[package]
name = "bicho"
version = "0.1.0"
edition = "2024"
description = "El bicho de discada: un animalito de pixeles que se pasea por el escritorio, trepa las ventanas y se duerme"
license = "MIT"

[dependencies]
serde_json = { version = "1", features = ["preserve_order"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
smithay-client-toolkit = { version = "0.21", default-features = false, features = ["calloop"] }
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Media",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_RemoteDesktop",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
# nomás para los controles de medios (¿suena música?), que son WinRT
windows = { version = "0.62", default-features = false, features = [
    "Foundation",
    "Foundation_Collections",
    "Media_Control",
] }

[profile.release]
lto = true
codegen-units = 1
strip = true
