[package]
name = "bicho"
version = "0.1.0"
edition = "2024"
description = "El bicho de discada: un animalito de pixeles que se pasea por el escritorio, trepa las ventanas y se duerme"
license = "MIT"

[dependencies]
libc = "0.2"
serde_json = { version = "1", features = ["preserve_order"] }
smithay-client-toolkit = { version = "0.21", default-features = false, features = ["calloop"] }
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
